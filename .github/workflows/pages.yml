name: Publish atlas

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/papers.json
      - data/status.json
      - scripts/build.py
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_run:
    workflows: ["Discover papers"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: atlas-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
