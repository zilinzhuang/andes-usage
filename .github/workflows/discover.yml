name: Discover papers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/discover.yml
      - scripts/discover.py
      - tests/test_discovery.py
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discovery-default-branch
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run discovery checks
        run: python -m unittest discover -s tests -p test_discovery.py
      - name: Discover papers and queue evidence for review
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/discover.py
      - name: Save discovery results
        run: |
          git add -- data/candidates.json data/status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update literature discovery queue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
